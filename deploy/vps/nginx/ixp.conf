# deploy/vps/nginx/ixp.conf
# ─────────────────────────────────────────────────────────────────────────────
# À copier dans /etc/nginx/sites-available/ixp.conf puis activer
# (voir README). certbot ajoute ensuite lui-même les blocs HTTPS.
#
# Reproduit le comportement Vercel :
#   - import-expert.ma  → 308 vers www.import-expert.ma (domaine principal)
#   - import-ia.com     → 308 vers www.import-ia.com
#   - demo.import-ia.ma → démo (port 3001)
#   - test.import-ia.ma → production sur le VPS, pour les essais avant bascule
#
# X-Forwarded-For est REMPLACÉ (et non complété) par l'IP réelle du visiteur :
# le code lit la première valeur de cet en-tête pour le rate-limit et les
# journaux de connexion ; un visiteur ne doit pas pouvoir la falsifier.
# ─────────────────────────────────────────────────────────────────────────────

upstream ixp_prod { server 127.0.0.1:3000; keepalive 16; }
upstream ixp_demo { server 127.0.0.1:3001; keepalive 4; }

# Réglages communs aux deux applications
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

# ── Redirections des domaines nus vers www ──────────────────────────────────
server {
  listen 80;
  server_name import-expert.ma;
  return 308 https://www.import-expert.ma$request_uri;
}
server {
  listen 80;
  server_name import-ia.com;
  return 308 https://www.import-ia.com$request_uri;
}

# ── Production ──────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name www.import-expert.ma www.import-ia.com test.import-ia.ma;

  client_max_body_size 12m;          # import de circulaires jusqu'à 10 Mo
  proxy_read_timeout 300s;           # réponses d'IA longues
  proxy_send_timeout 300s;

  location / {
    proxy_pass http://ixp_prod;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_buffering off;             # réponses de l'IA envoyées au fil de l'eau
  }
}

# ── Démo ────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name demo.import-ia.ma;

  client_max_body_size 12m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Ne pas laisser la démo être indexée à côté du site officiel
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    proxy_pass http://ixp_demo;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_buffering off;
  }
}
